<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#0f2a20" />
		<title>Нет связи — ПрогноCIк</title>
		<style>
			* { box-sizing: border-box; }
			body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #0f2a20; color: #f2f3ee; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
			main { max-width: 360px; text-align: center; }
			img { width: 72px; height: 72px; border-radius: 20px; }
			h1 { margin: 20px 0 8px; font-size: 24px; }
			p { margin: 0 0 24px; color: #a9b8ae; }
			button { height: 48px; padding: 0 28px; border: 0; border-radius: 14px; background: #21a24a; color: #fff; font: inherit; font-weight: 600; }
		</style>
	</head>
	<body>
		<main>
			<img src="/icon-192.png" alt="" />
			<h1>Нет связи</h1>
			<p>ПрогноCIк показывает только актуальные данные счёта, поэтому без интернета он не работает. Проверьте соединение и попробуйте снова.</p>
			<button type="button" onclick="location.reload()">Повторить</button>
		</main>
	</body>
</html>
