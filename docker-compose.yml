# Фронтенд ПрогноCIк.
#
#   docker compose up -d --build              → http://localhost:8080
#   GATEWAY_URL=https://api.example.com docker compose up -d --build
#
# Чтобы подключить фронт к бэкенду из hack-2026-back (compose.full.yaml) по внутренней сети:
#   docker compose -f docker-compose.yml -f docker-compose.backend.yml up -d --build
services:
    frontend:
        build:
            context: .
            args:
                VITE_API_URL: ${VITE_API_URL:-}
                VITE_SITE_URL: ${VITE_SITE_URL:-}
        image: prognocik-frontend:latest
        restart: unless-stopped
        environment:
            GATEWAY_URL: ${GATEWAY_URL:-http://gateway:5001}
            DNS_RESOLVER: ${DNS_RESOLVER:-127.0.0.11}
            MAX_UPLOAD: ${MAX_UPLOAD:-110m}
        ports:
            - "${FRONTEND_PORT:-8080}:8080"
        read_only: true
        tmpfs:
            - /tmp
            - /var/cache/nginx:uid=101,gid=101,mode=0755
            - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
