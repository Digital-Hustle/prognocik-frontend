<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta
			name="description"
			content="ПрогноCIк — прогноз остатка и кассовых разрывов для малого бизнеса. Банк Центр-инвест."
		/>
		<meta
			name="theme-color"
			content="#0f2a20"
		/>
		<meta
			name="mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-capable"
			content="yes"
		/>
		<meta
			name="apple-mobile-web-app-title"
			content="ПрогноCIк"
		/>
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="default"
		/>
		<meta
			name="format-detection"
			content="telephone=no"
		/>
		<!-- Предпросмотр ссылки: Telegram, WhatsApp, VK, Slack -->
		<meta
			property="og:type"
			content="website"
		/>
		<meta
			property="og:site_name"
			content="ПрогноCIк"
		/>
		<meta
			property="og:locale"
			content="ru_RU"
		/>
		<meta
			property="og:title"
			content="ПрогноCIк — прогноз денег для бизнеса"
		/>
		<meta
			property="og:description"
			content="Узнайте о кассовом разрыве до того, как он случится: прогноз остатка на 30 дней по вашей выписке. Банк Центр-инвест."
		/>
		<meta
			property="og:url"
			content="%SITE_URL%/"
		/>
		<meta
			property="og:image"
			content="%SITE_URL%/og-prognocik.jpg"
		/>
		<meta
			property="og:image:type"
			content="image/jpeg"
		/>
		<meta
			property="og:image:width"
			content="1200"
		/>
		<meta
			property="og:image:height"
			content="631"
		/>
		<meta
			property="og:image:alt"
			content="ПрогноCIк — прогноз денег для бизнеса"
		/>
		<meta
			name="twitter:card"
			content="summary_large_image"
		/>
		<meta
			name="twitter:title"
			content="ПрогноCIк — прогноз денег для бизнеса"
		/>
		<meta
			name="twitter:description"
			content="Узнайте о кассовом разрыве до того, как он случится: прогноз остатка на 30 дней по вашей выписке."
		/>
		<meta
			name="twitter:image"
			content="%SITE_URL%/og-prognocik.jpg"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg"
		/>
		<link
			rel="apple-touch-icon"
			href="/apple-touch-icon.png"
		/>
		<link
			rel="manifest"
			href="/manifest.webmanifest"
		/>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<!-- Тема до первой отрисовки: без вспышки светлого фона в тёмной теме -->
		<script>
			try {
				var m = localStorage.getItem("prognocik.theme") || "system";
				var d = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", d);
			} catch (e) {}
		</script>
		<title>ПрогноCIк — прогноз денег для бизнеса</title>
	</head>
	<body>
		<div id="root"></div>
		<script
			type="module"
			src="/src/index.tsx"
		></script>
	</body>
</html>
